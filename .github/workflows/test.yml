name: Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Python Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov pytest-asyncio pytest-homeassistant-custom_component hypothesis

      - name: Run Ruff Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy
        run: mypy custom_components/forecast_fusion

      - name: Run Pytest
        run: pytest
